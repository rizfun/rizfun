# Riz.Fun / Pons V2 BSC Foundry project
# Contracts remapped via lib/ symlinks -> ../pons-fork/contractsV2

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false
via_ir = true
allow_paths = ["../pons-fork"]

[rpc_endpoints]
bsc = "${BSC_RPC}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
